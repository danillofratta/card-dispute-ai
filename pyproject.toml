[project]
name = "dispute-analyst"
version = "0.1.0"
description = "AI analyst for credit-card disputes: classifies, investigates and proposes a decision with cited sources."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.159.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# labs/, evals/, ingestion/ and ui/ join as members in their own modules.
[tool.uv.workspace]
members = []

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "INP"]

[tool.ruff.lint.isort]
known-first-party = ["dispute_analyst", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001"]
"migrations/**" = ["INP001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The repo root, so tests can import scripts/ (the seed generator).
pythonpath = ["."]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "integration: needs containers (Postgres, Kafka, RabbitMQ, Redis)",
]
# Architecture contracts from AGENTS.md ("Dependency rules"). Never weaken them to make the build pass.
[tool.importlinter]
root_package = "dispute_analyst"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "1. Pure core: domain and application import no framework and no outer layer"
type = "forbidden"
source_modules = ["dispute_analyst.domain", "dispute_analyst.application"]
forbidden_modules = [
    "pydantic",
    "langchain",
    "langchain_core",
    "langchain_community",
    "langchain_openai",
    "langchain_anthropic",
    "langchain_ollama",
    "langgraph",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "psycopg",
    "psycopg2",
    "asyncpg",
    "aiokafka",
    "confluent_kafka",
    "kafka",
    "aio_pika",
    "pika",
    "redis",
    "httpx",
    "requests",
    "openai",
    "anthropic",
    "ollama",
    "dispute_analyst.features",
    "dispute_analyst.infrastructure",
    "dispute_analyst.bootstrap",
    "dispute_analyst.main",
]

[[tool.importlinter.contracts]]
name = "2. Layers: main -> bootstrap -> infrastructure -> application -> domain"
type = "layers"
layers = [
    "dispute_analyst.main",
    "dispute_analyst.bootstrap",
    "dispute_analyst.infrastructure",
    "dispute_analyst.application",
    "dispute_analyst.domain",
]

[[tool.importlinter.contracts]]
name = "3. Independent slices: features.<context>.<slice> never import each other"
type = "independence"
modules = ["dispute_analyst.features.*.*"]

[[tool.importlinter.contracts]]
name = "4. Features never import infrastructure directly; only bootstrap does"
type = "forbidden"
source_modules = ["dispute_analyst.features"]
forbidden_modules = ["dispute_analyst.infrastructure"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "5. Slice core (command, query, handler, ports, result) knows only domain and application"
type = "forbidden"
source_modules = [
    "dispute_analyst.features.*.*.command",
    "dispute_analyst.features.*.*.query",
    "dispute_analyst.features.*.*.handler",
    "dispute_analyst.features.*.*.ports",
    "dispute_analyst.features.*.*.result",
]
forbidden_modules = [
    "dispute_analyst.bootstrap",
    "dispute_analyst.infrastructure",
    "fastapi",
    "starlette",
    "pydantic",
]

[[tool.importlinter.contracts]]
name = "6. Infrastructure implements ports; never reaches endpoints, models or handlers"
type = "forbidden"
source_modules = ["dispute_analyst.infrastructure"]
forbidden_modules = [
    "dispute_analyst.features.*.*.endpoint",
    "dispute_analyst.features.*.*.models",
    "dispute_analyst.features.*.*.handler",
    "dispute_analyst.bootstrap",
    "dispute_analyst.main",
]

[[tool.importlinter.contracts]]
name = "7. Product isolation: dispute_analyst never imports labs, evals, ingestion or ui"
type = "forbidden"
source_modules = ["dispute_analyst"]
forbidden_modules = ["labs", "evals", "ingestion", "ui"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

