[project]
name = "dispute-analyst"
version = "0.1.0"
description = "AI analyst for credit-card disputes: classifies, investigates and proposes a decision with cited sources."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# labs/, evals/, ingestion/ and ui/ join as members in their own modules.
[tool.uv.workspace]
members = []

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "INP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "integration: needs containers (Postgres, Kafka, RabbitMQ, Redis)",
]

# Architecture contracts from AGENTS.md ("Dependency rules"). Never weaken them to make the build pass.
[tool.importlinter]
root_package = "dispute_analyst"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "1. Pure domain: domain imports only the standard library and itself"
type = "forbidden"
source_modules = ["dispute_analyst.domain"]
forbidden_modules = [
    "pydantic",
    "langchain",
    "langchain_core",
    "langchain_community",
    "langchain_openai",
    "langchain_anthropic",
    "langchain_ollama",
    "langgraph",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "psycopg",
    "psycopg2",
    "asyncpg",
    "aiokafka",
    "confluent_kafka",
    "kafka",
    "aio_pika",
    "pika",
    "redis",
    "httpx",
    "requests",
    "dispute_analyst.features",
    "dispute_analyst.projections",
    "dispute_analyst.ports",
    "dispute_analyst.agents",
    "dispute_analyst.knowledge",
    "dispute_analyst.adapters",
    "dispute_analyst.infra",
    "dispute_analyst.entrypoints",
]

[[tool.importlinter.contracts]]
name = "2. Layers: entrypoints -> features | projections -> ports -> domain"
type = "layers"
layers = [
    "dispute_analyst.entrypoints",
    "dispute_analyst.features | dispute_analyst.projections",
    "dispute_analyst.ports",
    "dispute_analyst.domain",
]

[[tool.importlinter.contracts]]
name = "3. Independent slices: features.* do not import each other"
type = "independence"
modules = ["dispute_analyst.features.*"]

[[tool.importlinter.contracts]]
name = "4. Adapter-like packages depend only on ports and domain"
type = "layers"
layers = [
    "dispute_analyst.entrypoints",
    "dispute_analyst.features | dispute_analyst.projections | dispute_analyst.agents | dispute_analyst.knowledge | dispute_analyst.adapters | dispute_analyst.infra",
    "dispute_analyst.ports",
    "dispute_analyst.domain",
]

[[tool.importlinter.contracts]]
name = "5. Composition root: only entrypoints imports agents, knowledge, adapters and infra"
type = "forbidden"
source_modules = [
    "dispute_analyst.features",
    "dispute_analyst.projections",
    "dispute_analyst.ports",
    "dispute_analyst.domain",
]
forbidden_modules = [
    "dispute_analyst.agents",
    "dispute_analyst.knowledge",
    "dispute_analyst.adapters",
    "dispute_analyst.infra",
]

[[tool.importlinter.contracts]]
name = "6. Product isolation: dispute_analyst never imports labs, evals, ingestion or ui"
type = "forbidden"
source_modules = ["dispute_analyst"]
forbidden_modules = ["labs", "evals", "ingestion", "ui"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
