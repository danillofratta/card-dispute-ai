name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only checks code, it never writes to the repo.
permissions:
  contents: read

# A new push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, contracts and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Actions pinned by commit SHA (supply-chain safety); the comment shows the version.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv reads .python-version and installs Python 3.12 by itself.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install the workspace
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src

      - name: Architecture contracts
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest
  integration:
    name: Postgres integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The same image docker compose uses, started by GitHub next to the job.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: dispute
          POSTGRES_PASSWORD: dispute
          POSTGRES_DB: disputes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispute -d disputes_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://dispute:dispute@localhost:5432/disputes_test
      TEST_DATABASE_URL: postgresql+asyncpg://dispute:dispute@localhost:5432/disputes_test

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install the workspace
        run: uv sync --locked

      - name: Run the migrations
        run: uv run alembic upgrade head

      # Fails if a table model changed without a migration.
      - name: Models match the migrations
        run: uv run alembic check

      - name: Integration tests
        run: uv run pytest -m integration
