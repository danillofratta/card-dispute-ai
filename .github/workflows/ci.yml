name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only checks code, it never writes to the repo.
permissions:
  contents: read

# A new push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, contracts and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Actions pinned by commit SHA (supply-chain safety); the comment shows the version.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv reads .python-version and installs Python 3.12 by itself.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install the workspace
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src

      - name: Architecture contracts
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest